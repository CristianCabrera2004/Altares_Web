# fly.toml — Librería Los Altares API
# Generado para: backend-cinder-shape-4030
# Ver: https://fly.io/docs/reference/configuration/

app = 'backend-cinder-shape-4030'
primary_region = 'dfw'

[build]

[env]
  PORT = "8080"
  APP_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
